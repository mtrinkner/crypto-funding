name: forward test xv_v1

# Weekly: score last week's frozen positions, then write next week's before
# their outcome exists. The runner refuses to write outside 12h of Monday
# 00:00 UTC, so a delayed or manual run cannot backfill the live record.
#
# GitHub often starts scheduled jobs hours late (the first live run started
# 5h41m late), so there are two backup runs. The runner is idempotent: once
# this week's positions are written, a later run does nothing.
on:
  schedule:
    - cron: "20 0 * * 1"
    - cron: "20 3 * * 1"
    - cron: "20 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch and print, write nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: crypto-funding-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python forward_xv.py run --dry-run
          else
            python forward_xv.py run
            # Measure what entering this week's positions would cost right now.
            python exec_costs.py snapshot || echo "snapshot failed; the forward test is unaffected"
          fi
          python forward_xv.py status
      - name: commit
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add data/forward_xv.jsonl data/exec_costs.jsonl 2>/dev/null || true
            git commit -m "forward xv_v1: run of $(date -u +'%F %H:%M')"
            git pull --rebase
            git push
          fi
